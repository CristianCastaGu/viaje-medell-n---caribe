    <script>
      // Aplica el tema guardado antes del primer paint (evita el flash del tema equivocado).
      try {
        var t = localStorage.getItem('rc_theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
